<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>28 Days of Data Science</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container header-content">
            <h1>Data Science <span class="accent">Path</span></h1>
            <p>From Zero to Hero in 28 Days. Practical. Granular. Proven.</p>
        </div>
    </header>

    <div class="progress-container sticky">
        <div class="container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <div class="progress-text">
                <span id="completedCount">0</span>/28 Days Completed
            </div>
        </div>
    </div>

    <main class="container" id="app">
        <!-- Days will be injected here by JS -->
    </main>

    <footer>
        <div class="container">
            <p>Built for practical learning. <a href="#" id="resetProgress">Reset Progress</a></p>
        </div>
    </footer>

    <!-- Load Data -->
    <script src="curriculum.js"></script>
    <!-- Load Logic -->
    <script src="script.js"></script>
</body>
</html>
